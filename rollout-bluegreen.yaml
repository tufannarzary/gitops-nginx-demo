apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
 name: nginx-bluegreen
spec:
 replicas: 2

 selector:
   matchLabels:
     app: nginx-bluegreen

 template:
   metadata:
     labels:
       app: nginx-bluegreen
   spec:
     containers:
     - name: nginx
       image: nginx:1.25
       ports:
       - containerPort: 80
       volumeMounts:
       - name: html-volume
         mountPath: /usr/share/nginx/html
     volumes:
     - name: html-volume
       configMap:
         name: nginx-blue-html

 strategy:
   blueGreen:
     activeService: nginx-active
     previewService: nginx-preview
     autoPromotionEnabled: false
